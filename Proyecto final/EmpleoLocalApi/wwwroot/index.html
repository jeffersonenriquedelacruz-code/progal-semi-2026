<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleo Local</title>
    <link rel="stylesheet" href="estilos.css">

    <style>
        .pantalla[hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="ventana">

     
        <section id="pantalla1" class="pantalla">
            <h1>EMPLEO LOCAL</h1>
            <h2>Encuentra el trabajo que necesitas</h2>

            <input type="text"
                   id="txtBuscar"
                   placeholder="¿Qué trabajo estás buscando?">

            <button id="btnBuscar">Buscar</button>
        </section>


        
        <section id="pantalla2" class="pantalla" hidden>
            <h1>EMPLEO LOCAL</h1>
            <h2>Selecciona tu departamento</h2>

            <select id="departamento">
                <option value="">Selecciona un departamento</option>
                <option value="Ahuachapán">Ahuachapán</option>
                <option value="Santa Ana">Santa Ana</option>
                <option value="Sonsonate">Sonsonate</option>
                <option value="Chalatenango">Chalatenango</option>
                <option value="La Libertad">La Libertad</option>
                <option value="San Salvador">San Salvador</option>
                <option value="Cuscatlán">Cuscatlán</option>
                <option value="La Paz">La Paz</option>
                <option value="Cabañas">Cabañas</option>
                <option value="San Vicente">San Vicente</option>
                <option value="Usulután">Usulután</option>
                <option value="San Miguel">San Miguel</option>
                <option value="Morazán">Morazán</option>
                <option value="La Unión">La Unión</option>
            </select>

            <br><br>

            <button id="btnOfertas">Ver ofertas</button>
            <br><br>
            <button id="btnVolver1">Regresar</button>
        </section>


        
        <section id="pantalla3" class="pantalla" hidden>
            <h1>OFERTAS DE EMPLEO</h1>

            <div id="resultados"></div>

            <br>
            <button id="btnVolver2">Regresar</button>
        </section>

    </div>


    <script>
                function mostrarPantalla(numero) {
                    document.getElementById("pantalla1").hidden = numero !== 1;
                    document.getElementById("pantalla2").hidden = numero !== 2;
                    document.getElementById("pantalla3").hidden = numero !== 3;
                }

                
                document.getElementById("btnBuscar").addEventListener("click", function () {
                    const texto = document.getElementById("txtBuscar").value.trim();

                    if (texto === "") {
                        alert("Escribe el trabajo que estás buscando.");
                        return;
                    }

                    mostrarPantalla(2);
                });


               
                document.getElementById("btnVolver1").addEventListener("click", function () {
                    mostrarPantalla(1);
                });


                document.getElementById("btnOfertas").addEventListener("click", buscarOfertas);

                async function buscarOfertas() {
                    const texto = document.getElementById("txtBuscar").value.trim();
                    const departamento = document.getElementById("departamento").value;

                    if (departamento === "") {
                        alert("Selecciona un departamento.");
                        return;
                    }

                    mostrarPantalla(3);

                    const resultados = document.getElementById("resultados");
                    resultados.innerHTML = "<p>Buscando ofertas...</p>";

                    try {
                        const url = "/api/empleos?texto=" +
                            encodeURIComponent(texto) +
                            "&departamento=" +
                            encodeURIComponent(departamento);

                        const respuesta = await fetch(url);

                        if (!respuesta.ok) {
                            throw new Error("Error al consultar las ofertas.");
                        }

                        const empleos = await respuesta.json();

                        resultados.innerHTML = "";

                        if (empleos.length === 0) {
                            resultados.innerHTML = "<p>No se encontraron ofertas en este departamento.</p>";
                            return;
                        }

                        empleos.forEach(function (empleo) {
                            const elemento = document.createElement("div");

                            const titulo = document.createElement("h3");
                            titulo.textContent = empleo.titulo;

                            const lugar = document.createElement("p");
                            lugar.textContent = "Lugar: " + empleo.lugar;

                            elemento.appendChild(titulo);
                            elemento.appendChild(lugar);

                            resultados.appendChild(elemento);
                        });

                    } catch (error) {
                        resultados.innerHTML = "<p>Error al cargar las ofertas. Verifica que la API esté funcionando.</p>";
                        console.error(error);
                    }
                }


            
                document.getElementById("btnVolver2").addEventListener("click", function () {
                    mostrarPantalla(2);
                });

    </script>

</body>
</html>
